name: anime-bot

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: anime-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: stamp
        run: date +%s > .started

      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: verify
        run: |
          python -m py_compile engine.py bot.py && echo "syntax OK"
          python -c "import engine; print('sites:', list(engine.SITES))"

      - name: run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          ( while true; do
              sleep 600
              git add -A data .keepalive 2>/dev/null || true
              git commit -qm "state" || true
              git push -q origin HEAD:main || true
            done ) &
          python bot.py

      - name: keepalive
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          date > .keepalive
          git add -A .keepalive data 2>/dev/null || true
          git commit -m "keepalive" || true
          git push origin HEAD:main || true

      - name: chain next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          start=$(cat .started 2>/dev/null || echo 0)
          lived=$(( now - start ))
          echo "lived=${lived}s"
          if [ "$lived" -lt 10800 ]; then
            echo "short run - cron will pick it up"
            exit 0
          fi
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}'
