name: anime-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: anime-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          ( while true; do
              sleep 600
              git add -A data .keepalive 2>/dev/null || true
              git commit -qm "state" || true
              git push -q origin HEAD:main || true
            done ) &
          python bot.py

      - name: keepalive
        if: always()
        run: |
          date > .keepalive
          git add -A .keepalive data 2>/dev/null || true
          git commit -m "keepalive" || true
          git push origin HEAD:main || true
